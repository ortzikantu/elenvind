# 发布：打 tag 后自动构建、校验、发布到 PyPI，并在 GitHub 建 Release。
#
# 认证用 PyPI 的 **Trusted Publishing**（OIDC）：不需要在仓库里存任何 token。
# 首次发布前必须在 PyPI 上登记 pending trusted publisher（见 manual/RELEASE.md）：
#   Owner: ortzikantu   Repository: elenvind
#   Workflow: publish.yml   Environment: pypi
#
# 触发方式是**只认 tag**（如 `v1.0.0`）：tag 名去掉前缀必须与 pyproject.toml 的
# version 完全一致，否则第一步就失败 —— 避免"发出去的包和 tag 对不上"。

name: publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+*"      # 预发布：v1.0.1rc1 / v1.1.0.dev1 …

permissions:
  contents: read

jobs:
  verify:
    name: 校验版本与产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff build trove-classifiers

      - name: tag 必须与 pyproject 的版本一致
        run: |
          python - <<'PY'
          import os, pathlib, tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert tag == version, f"tag {tag!r} 与 pyproject 的 version {version!r} 不一致"
          print(f"版本一致：{version}")
          PY

      - name: 静态检查与全量测试
        run: |
          ruff check .
          python -m unittest discover -s tests -t . -v

      - name: 构建
        run: |
          rm -rf dist build ./*.egg-info
          python -m build
          ls -l dist/

      - name: 产物自检（元数据 + 不含站点实例数据）
        run: |
          set -e
          pip install twine
          twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]
          wheel_names = zipfile.ZipFile(wheel).namelist()
          with tarfile.open(sdist) as archive:
              sdist_names = archive.getnames()

          for names, label in ((wheel_names, "wheel"), (sdist_names, "sdist")):
              leaked = [n for n in names
                        if n.endswith("config.toml") or "/articles/" in n
                        or "/custom/" in n or "/data/" in n]
              assert not leaked, f"{label} 混进了站点实例数据：{leaked}"
          print("产物检查通过")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: 发布到 PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi                   # 与 PyPI 上登记的 environment 一致
    permissions:
      id-token: write                   # Trusted Publishing 必需；不需要任何 secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布
        uses: pypa/gh-action-pypi-publish@release/v1
        # 默认目标 https://upload.pypi.org/legacy/，凭据由 OIDC 换取。

  release:
    name: 建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write                   # 建 Release 需要
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 创建 Release 并附上产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
             --repo "$GITHUB_REPOSITORY" \
             --title "$GITHUB_REF_NAME" \
             --generate-notes
